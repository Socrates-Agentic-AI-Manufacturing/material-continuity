action_groups:
  - actions:
      - type: api-request
        method: GET
        system_alias: MATERIAL_CONTINUITY_API
        path: /api/joule/exposure
        result_variable: exposure_result
      - type: message
        message:
          type: text
          markdown: true
          content: >-
            <? exposure_result.body.case_count == 0
            ? "No active material exposure cases were found."
            : "Material exposure: " + exposure_result.body.cases[0].material_id
            + ". Shortage date: " + exposure_result.body.cases[0].shortage_date
            + ". Exposed quantity: " + exposure_result.body.cases[0].exposed_quantity
            + ". Affected orders: " + exposure_result.body.cases[0].exposed_order_count ?>
result:
  case_count: <? exposure_result.body.case_count ?>
  message: <? exposure_result.body.message ?>
